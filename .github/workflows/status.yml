name: Check and publish the status page

on:
  schedule:
    # Every five minutes, the most often GitHub allows, starting at two past
    # the hour, because the top of the hour is when GitHub is busiest.
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time, so each run reads the history the last one published.
concurrency:
  group: status-page
  cancel-in-progress: false

jobs:
  check:
    name: Check the targets and build the page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # A push runs every check before publishing. A scheduled run only
      # rebuilds the page, to stay quick.
      - name: Check and build
        if: github.event_name == 'push'
        run: npm run check

      - name: Build
        if: github.event_name != 'push'
        run: npm run build

      - id: pages
        uses: actions/configure-pages@v6

      # Reads the history from the published status.json, checks every
      # target, and writes the updated file into the built page.
      - name: Check every target
        run: npm run monitor
        env:
          STATUS_PAGE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub turns off scheduled workflows in a public repository after 60
      # days with no activity. An empty commit after 50 quiet days keeps the
      # checks running. Pushes made by this workflow don't start it again, and
      # a push that fails, such as to a protected branch, doesn't stop the page
      # from publishing.
      - name: Keep the schedule running
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          last_commit="$(git log -1 --format=%ct)"
          if [ $(( $(date +%s) - last_commit )) -gt $(( 50 * 24 * 60 * 60 )) ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Keep the scheduled status checks running'
            git push
          fi

  deploy:
    name: Publish to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
