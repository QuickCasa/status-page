version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint only supports TypeScript below 6.1, and TypeScript 7
      # has no JavaScript API yet. Lift this once typescript-eslint supports it.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # The types must match the oldest Node.js version in package.json engines.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
