<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <meta name="description" content="__META_DESCRIPTION__" />
    <meta
      name="theme-color"
      content="#fbfaff"
      media="(prefers-color-scheme: light)" />
    <meta
      name="theme-color"
      content="#0f0d17"
      media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f9d55'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffffff'/%3E%3C/svg%3E" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="masthead">
      <h1 class="masthead__title">__PAGE_TITLE__</h1>
      <p class="masthead__description">__PAGE_DESCRIPTION__</p>
    </header>

    <main id="status" class="page">
      <section class="banner banner--unknown">
        <span class="banner__dot" aria-hidden="true"></span>
        <div class="banner__text">
          <h2 class="banner__headline">Checking</h2>
          <p class="banner__detail">Loading the latest status.</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>
        Each bar shows the last 90 days, one line a day, in UTC. Point at a day
        to see its checks. The page reloads the status every minute.
      </p>
      <p>
        Made with
        <a href="https://github.com/QuickCasa/status-page">Status Page</a>, free
        and open source from <a href="https://quickcasa.ai">QuickCasa</a>.
      </p>
    </footer>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  </body>
</html>
